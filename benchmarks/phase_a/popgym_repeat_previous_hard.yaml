# POPGym RepeatPrevious-Hard — Tier 1 differentiation benchmark.
#
# vs the Easy variant (52-step episodes, ~K=4 lookback):
#   - Episodes are ~155 steps (3× longer)
#   - Lookback distance is much longer — small vector cell states overflow,
#     matrix-memory cells should pull ahead of LSTM/GRU here.
#
# Observed pre-training random reward: ~-0.63 / episode. Max possible reward
# is +1 per step correct, so episode max ≈ +155. PPO normalizes per-step
# reward to roughly [-1, 1] depending on POPGym's internal normalization;
# the eval/mean_reward metric should target +0.5 to +1.0 if memory works.
#
# Recommended on a GPU (3070 Ti class) where the 5M-step budget completes
# in <2 hours. Apple M3 CPU runs are usable but ~5× slower.

env_name: popgym-RepeatPreviousHard-v0
n_envs: 8

# Budget aligned with POPGym paper (Morad 2023): 15M env steps. Matrix-memory
# cells under-train below ~10M at our small state sizes. For quick iteration
# (Mac) override with `--total-timesteps 3000000`.
total_timesteps: 15_000_000

seed: 0

cell:
  name: IGAM
  kwargs:
    n_heads: 4

encoder_dim: 64
encoder_hidden: 128

# Option A (separate backbones) is the default in IGAMPPO — overridable
# via `shared_backbones: true` if we ever want to ablate.

lr: 3.0e-4

n_steps: 1024            # per-env; rollout = n_envs * n_steps = 8192
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# TBPTT chunking. Longer than Easy because the recall horizon is longer.
chunk_len: 32                       # 16 → 32 (Hard needs longer-range gradient flow)
n_chunks_per_batch: 8               # 16 → 8 (keeps minibatch transitions = 32 * 8 = 256)
