# Row 2 of the ADR 0005 ablation: Multi-scale Multichannel LMU on Hard.
# See `mslmu_medium.yaml` for the rationale.
#
# Hard is the most informative difficulty for this row: GatedLMU-tuned
# collapsed here (+0.083 → -0.287). If MSLMU also collapses, multi-scale
# alone is insufficient. If MSLMU stays stable, multi-scale is doing the
# real work and gating is decorative.

env_name: popgym-RepeatPreviousHard-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 300.0                  # banks at {150, 300, 600}
    gate_type: none
    n_scales: 3
    scale_factor: 2.0
    layer_norm: true
    readout_skip_scale: 0.1
    orthogonal_W_pre: false
    salience_gate: false
    hadamard_calib: false

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
