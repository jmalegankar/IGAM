# 15M suite — GatedLMU on CountRecallMedium. Pair with lmu_countrecall_medium_15M.
# F1 data showed grokking at 2.5-3M and equilibration with LMU by 4M.
# 15M lets us see whether stability holds through the long horizon, like
# F4 on RP-Medium suggested.

env_name: popgym-CountRecallMedium-v0
n_envs: 8

total_timesteps: 15_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 128
    theta: 400.0
    gate_type: none

encoder_dim: 64
encoder_hidden: 128

lr: 2.0e-4
target_kl: 0.03

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
