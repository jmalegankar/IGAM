# Row 2 of the ADR 0005 ablation: Multi-scale Multichannel LMU on Medium.
#
# This is the critical NO-GATE test. Everything that SelectiveLMU has
# EXCEPT the softsign-sum write gate and the salience gate:
#   - Multichannel u (multichannel encoder)
#   - Multi-scale theta K=3 banks at {100, 200, 400}
#   - LayerNorm on h_prev
#   - Readout skip 0.1
#   - Orthogonal W_pre
#
# `gate_type='none'` ⇒ u_actual = u_x + (u_h + u_m). Pure additive write,
# no innovation gating.
#
# Compare to:
#   - SelectiveLMU Medium (with gates)    → arrow 2→5: gates' contribution
#   - MCLMU Medium (no multi-scale)        → arrow 1→2: multi-scale's contribution
#
# Param-matched with SelectiveLMU (~25k cell params), same training recipe
# (lr=1e-4, target_kl=0.02, 5M steps).

env_name: popgym-RepeatPreviousMedium-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 200.0
    gate_type: none              # ← the key ablation: no write gate
    n_scales: 3
    scale_factor: 2.0
    layer_norm: true
    readout_skip_scale: 0.1
    orthogonal_W_pre: false       # no W_pre when gate_type=none
    salience_gate: false
    hadamard_calib: false

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
