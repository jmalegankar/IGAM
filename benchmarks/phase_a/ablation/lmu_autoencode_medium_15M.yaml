# 15M suite — LMU on AutoencodeMedium.
# Hardest POPGym task per SHM paper (Le et al. 2025 Table 1): all standard
# baselines fail at 15M, only SHM hits -28.8. We expect LMU to also struggle;
# this is a calibration run.
#
# Hyperparam delta vs. tuned 2M:
#   lr 2e-4 → 5e-5      — POPGym RLlib default; harder env needs stability
#   target_kl 0.03 → 0.02 — tighter to prevent KL violations
#   theta 200 → 400      — episode length 207
#   total_timesteps 2M → 15M — POPGym standard

env_name: popgym-AutoencodeMedium-v0
n_envs: 8

total_timesteps: 15_000_000

seed: 0

cell:
  name: LMU
  kwargs:
    memory_size: 128
    theta: 400.0

encoder_dim: 64
encoder_hidden: 128

lr: 5.0e-5
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
