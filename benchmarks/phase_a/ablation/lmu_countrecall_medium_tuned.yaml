# F1-suite — plain LMU on CountRecallMedium at the GatedLMU-tuned hyperparams.
# CountRecall obs is MultiDiscrete([n, n]); FlattenMultiDiscrete handles it.

env_name: popgym-CountRecallMedium-v0
n_envs: 8

total_timesteps: 2_000_000

seed: 0

cell:
  name: LMU
  kwargs:
    memory_size: 128
    theta: 400.0

encoder_dim: 64
encoder_hidden: 128

lr: 2.0e-4
target_kl: 0.03

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
