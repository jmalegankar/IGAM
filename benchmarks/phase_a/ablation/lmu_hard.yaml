# Row 0 of the ADR 0005 ablation: canonical LMU on Hard.
# See `lmu_medium.yaml` for the rationale.

env_name: popgym-RepeatPreviousHard-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: LMU
  kwargs:
    memory_size: 64
    theta: 300.0

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
