# GatedMSLMU on MiniGrid-Memory-S13.
#
# Same as mslmu_mg_s13.yaml but WITH the softsign_sum write gate. The
# critical "do gates help on selective-memory tasks?" comparison.
#
# If GatedMSLMU > MSLMU here (and reverse on POPGym), the paper has a
# clean two-axis story: gates needed when selectivity demands it, multi-
# scale needed always.

env_name: MiniGrid-MemoryS13-v0
n_envs: 8

total_timesteps: 2_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 200.0
    gate_type: softsign_sum      # write gate ON — the differentiator vs mslmu
    n_scales: 3
    scale_factor: 2.0
    layer_norm: true
    readout_skip_scale: 0.1
    orthogonal_W_pre: true
    salience_gate: false
    hadamard_calib: false

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
