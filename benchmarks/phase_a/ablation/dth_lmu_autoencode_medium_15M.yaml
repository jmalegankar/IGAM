# 15M suite — DTH-LMU on AutoencodeMedium.
# Hebbian M should help: encodes (position_key → observation_value) bindings
# that survive the full episode, enabling content-addressed retrieval.
# θ=200 → θ_s = 200²/32 = 1250: slow LegT covers the full episode (~1200 steps).
# Matches GatedLMU HPs (lr, kl, n_steps) for fair comparison.

env_name: popgym-AutoencodeMedium-v0
n_envs: 8

total_timesteps: 15_000_000

seed: 0

cell:
  name: DTHLMU
  kwargs:
    memory_size: 32
    theta: 200.0
    n_scales: 3
    scale_factor: 2.0
    assoc_size: 128        # larger M helps content-addressed recall in long episodes
    residual_scale: 0.05
    readout_skip_scale: 0.1

encoder_dim: 64
encoder_hidden: 128

lr: 5.0e-5
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
