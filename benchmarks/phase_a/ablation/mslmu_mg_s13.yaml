# MSLMU (no gate) on MiniGrid-Memory-S13.
#
# The selective-recall counterpart to POPGym's pure-recall tasks. If gates
# DO matter (as we hypothesize), this is where it should show: the corridor
# steps in MG-M carry no key information and need to be filtered out.
#
# Prediction: if the no-gate hypothesis holds (multi-scale alone is the
# contribution), MSLMU should still match or beat the gated variants here.
# If gates win on MG-M but lose on POPGym, that's the two-axis story.
#
# theta=200 — episodes can run 100-300 steps; banks at {100, 200, 400}.

env_name: MiniGrid-MemoryS13-v0
n_envs: 8

total_timesteps: 2_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 200.0
    gate_type: none              # no write gate — the architecture-only ablation
    n_scales: 3
    scale_factor: 2.0
    layer_norm: true
    readout_skip_scale: 0.1
    orthogonal_W_pre: false
    salience_gate: false
    hadamard_calib: false

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
