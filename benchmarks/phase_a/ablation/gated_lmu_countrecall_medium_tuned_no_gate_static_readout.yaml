# F1-supplement (readout-bottleneck test) — GatedLMU(none) with STATIC readout
# (W_static, Xavier-init) instead of the dynamic W_query attention pointer.
#
# Diagnostic: tests whether the dynamic readout's deliberately-small init
# (gain=0.01 on W_query) is causing the GatedLMU(*) variants to spend most
# of the 2M-step budget warming up the attention pointer rather than learning
# the counting task. LMU's static W_m is Xavier-init and contributes to h
# from step 1 — we mimic that here.
#
# Identical to gated_lmu_countrecall_medium_tuned_no_gate.yaml except:
#   dynamic_readout: true (default) → dynamic_readout: false
# (W_static is then used with Xavier init, parallel to canonical LMU's W_m.)

env_name: popgym-CountRecallMedium-v0
n_envs: 8

total_timesteps: 2_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 128
    theta: 400.0
    gate_type: none
    dynamic_readout: false

encoder_dim: 64
encoder_hidden: 128

lr: 2.0e-4
target_kl: 0.03

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
