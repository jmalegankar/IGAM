# 15M suite — LMU on BattleshipEasy.
# Spatial-memory task with MultiDiscrete([8,8]) action. SHM paper reports
# SHM -12.3, GRU -41.1, FFM -34.0 at 15M. Our F1 LMU at 2M hit -24.6 best,
# already better than baselines they report.
#
# theta=128 — 64-step episodes give 2x headroom; memory_size=128 is generous.
# lr=1e-4: MultiDiscrete actions can be more sensitive; conservative LR.

env_name: popgym-BattleshipEasy-v0
n_envs: 8

total_timesteps: 15_000_000

seed: 0

cell:
  name: LMU
  kwargs:
    memory_size: 128
    theta: 128.0

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
