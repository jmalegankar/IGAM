# GatedLMU on RepeatPrevious-Medium — PPO-stability + capacity bump.
#
# Tuning rationale:
#   - PPO instability (see glmu_medium_ppostab.yaml notes): lr=1e-4 + target_kl
#   - Capacity: Easy run had 32 Legendre coefs over 51-step episodes
#     (0.64 coefs/step). Medium with memory_size=32 + theta=100 over 103-step
#     episodes gives only 0.31 coefs/step. Bumping to 64 restores parity
#     with Easy's resolution.
#
# Pair with glmu_medium_ppostab.yaml to attribute gains.

env_name: popgym-RepeatPreviousMedium-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64          # 32 -> 64 (restore coefs/step parity with Easy)
    theta: 200.0             # ~2x ep_len (103) — headroom past window boundary
    gate_type: softsign_sum

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
