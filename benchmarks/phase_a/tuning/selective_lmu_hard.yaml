# SelectiveLMU on RepeatPrevious-Hard — Paper 1 headline config (lean).
#
# Builds on glmu_hard_tuned (mem=96, theta=300, lr=1e-4, target_kl=0.02
# → +0.083 best at 786k, then collapse to -0.287). Swaps GatedLMU for
# the lean SelectiveLMU:
#   - Salience gate with bias=+8 init (near-identity decay; gates open
#     where signal demands)
#   - Multi-scale K=3 banks at thetas {150, 300, 600} — span from Medium-
#     range to twice-Hard-episode-length
#   - LayerNorm, readout skip 0.1, orthogonal W_pre
#   - NO Hadamard calibration (per Medium/Hard heavy-variant failures)
#
# memory_size kept at 64 (less than glmu_hard_tuned's 96, to give a
# slightly tighter Legendre-coefficient density at theta=300 — likely
# helpful for selective recall over 155-step episodes). Param-matched
# with glmu_medium_tuned (~25k).

env_name: popgym-RepeatPreviousHard-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: SelectiveLMU
  kwargs:
    memory_size: 64
    theta: 300.0                # banks at {150, 300, 600}
    gate_type: softsign_sum
    n_scales: 3
    scale_factor: 2.0
    readout_skip_scale: 0.1

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
