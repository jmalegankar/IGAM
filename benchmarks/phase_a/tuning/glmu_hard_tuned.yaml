# GatedLMU on RepeatPrevious-Hard — PPO-stability + capacity bump.
#
# Tuning rationale:
#   - PPO instability: lr=1e-4 + target_kl=0.02 (same as Medium tuned)
#   - Capacity: Hard episodes ~155 steps, theta=150. memory_size=64 gives
#     0.41 coefs/step. Bumping to 96 gives 0.62 coefs/step (parity with Easy).
#
# If this doesn't learn either, next iteration: lower lr further (3e-5) or
# bump chunk_len to 64.

env_name: popgym-RepeatPreviousHard-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 96          # 32 -> 96 (parity with Easy's coefs/step density)
    theta: 300.0             # ~2x ep_len (155) — headroom past window boundary
    gate_type: softsign_sum

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
