# GatedLMU on RepeatPrevious-Medium — PPO-stability fix only.
#
# Tuning rationale (from /tmp/igam_glmu_repeat/medium.log at ~786k steps):
#   - approx_kl ~0.04 (2x target for clip_range=0.2)
#   - clip_fraction ~0.22 (way above healthy 0.05-0.15)
#   - ep_rew_mean trending DOWN from -0.04 to -0.07 (unlearning, not plateau)
#
# Fix: lower LR + target_kl early-stop. Keep memory_size at thesis default
# (32) so this run isolates the PPO-stability change.
#
# Pair this with glmu_medium_tuned.yaml (same PPO fix + memory_size=64) to
# attribute any gain to PPO stability vs capacity.

env_name: popgym-RepeatPreviousMedium-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 32          # thesis default — unchanged
    theta: 200.0             # ~2x ep_len (103) — headroom past window boundary
    gate_type: softsign_sum

encoder_dim: 64
encoder_hidden: 128

# PPO stability fixes:
lr: 1.0e-4                   # 3e-4 -> 1e-4 (3x smaller updates)
target_kl: 0.02              # early-stop PPO epochs at this KL

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
