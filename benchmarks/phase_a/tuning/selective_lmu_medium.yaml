# SelectiveLMU on RepeatPrevious-Medium — Paper 1 headline config (lean).
#
# Builds on glmu_medium_tuned (mem=64, theta=200, lr=1e-4, target_kl=0.02
# → best +0.264) but swaps GatedLMU for SelectiveLMU lean:
#   - Salience gate (HiPPO Zoo §3.2) with bias=+8 (near-identity at init)
#   - Multi-scale theta K=3, sf=2 → banks at {100, 200, 400}
#   - LayerNorm, readout skip 0.1, orthogonal W_pre
#   - NO Hadamard calibration (dropped after the heavy version's gates
#     over-decayed memory and underperformed baseline on Hard).
#
# Param count: ~25k (essentially identical to GatedLMU-tuned). Clean
# param-matched A/B comparison.
#
# memory_size kept at 64 to match GatedLMU-tuned exactly.

env_name: popgym-RepeatPreviousMedium-v0
n_envs: 8

total_timesteps: 5_000_000

seed: 0

cell:
  name: SelectiveLMU
  kwargs:
    memory_size: 64
    theta: 200.0                # center; banks at θ/2, θ, 2θ = {100, 200, 400}
    gate_type: softsign_sum
    n_scales: 3
    scale_factor: 2.0
    readout_skip_scale: 0.1

encoder_dim: 64
encoder_hidden: 128

lr: 1.0e-4
target_kl: 0.02

n_steps: 1024
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

chunk_len: 32
n_chunks_per_batch: 8
