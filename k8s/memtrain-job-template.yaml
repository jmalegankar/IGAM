# Per-RUN Job TEMPLATE for the memory-training redo (experiments/memory_training).
# Substituted by k8s/launch-memtrain-jobs.sh — one Kubernetes Job (one GPU) per
# launch script. The registry now emits ONE script per run (one intrinsic), so a
# Job runs exactly one `python -m train` — no intrinsic-packing, no OOM risk, and
# bonus-vs-none stays fair because seeds are matched across Jobs.
# Only __JOBNAME__ and __SCRIPT__ are placeholders.
#
# Prereqs: image rebuilt at the CURRENT git ref (new envs: tiny_reproduce,
# autoencode_toggle, ExposeActionCoordsInObs; pbim; SnapshotCallback; E3B
# MultiDiscrete fix; done-step fix; registry configs). Secret `wandb` (key
# api-key). No PVC — wandb is the record (memrl-memtrain-*); snapshots upload as
# wandb artifacts (--snapshot-to-wandb).
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  labels: { app: memrl-memtrain }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200      # auto-clean finished Jobs after 3 days
  template:
    metadata:
      labels: { app: memrl-memtrain, job: "__JOBNAME__" }
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: r0hanpat1l/memory:latest
          imagePullPolicy: Always
          command: ["bash", "__SCRIPT__"]
          env:
            - name: DEVICE
              value: "cuda"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb
                  key: api-key
          # One training run per Job (16 envs, pixel-CNN + recurrent + optional
          # E3B/PBIM/NovelD module). Sized for a single run.
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "5"
              memory: 20Gi
