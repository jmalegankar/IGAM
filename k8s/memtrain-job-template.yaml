# Per-RUN(s) Job TEMPLATE for the memory-training redo (experiments/memory_training).
# Substituted by k8s/launch-memtrain-jobs.sh. With PACK=1 (default) one Job runs
# one `python -m train` on one GPU — no OOM risk, fair (seeds matched across Jobs).
# With PACK=N the launcher fills __COMMAND__ to run N already-emitted run-scripts
# in parallel on the one GPU (they share the device).
# Placeholders (launcher-filled): __JOBNAME__ __COMMAND__.
# Resources are SET BY HAND below — edit cpu/memory/gpu here; if you raise PACK,
# raise cpu/memory to match (the launcher does NOT scale them).
#
# Prereqs: image rebuilt at the CURRENT git ref (new envs: tiny_reproduce,
# autoencode_toggle, ExposeActionCoordsInObs/_SuccessOnTerminated; pbim;
# SnapshotCallback; E3B MultiDiscrete fix; done-step fix; success+param logging;
# registry configs). Secret `wandb` (key api-key). No PVC — wandb is the record
# (memrl-memtrain-*); snapshots upload as wandb artifacts (--snapshot-to-wandb).
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  labels: { app: memrl-memtrain }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200      # auto-clean finished Jobs after 3 days
  template:
    metadata:
      labels: { app: memrl-memtrain, job: "__JOBNAME__" }
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: r0hanpat1l/memory:latest
          imagePullPolicy: Always
          command: __COMMAND__
          env:
            - name: DEVICE
              value: "cuda"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb
                  key: api-key
            # wandb-resilience under cluster load (no image rebuild needed): the
            # default sync_tensorboard path + console capture + frequent system
            # stats starved the sync process under contention → mass heartbeat
            # loss (runs marked "crashed" while GPUs kept training). These cut the
            # sync workload and widen the connect/heartbeat tolerances.
            - { name: WANDB_CONSOLE, value: "off" }                  # don't stream stdout (tee'd to file anyway)
            - { name: WANDB__SERVICE_WAIT, value: "300" }            # tolerate slow service start
            - { name: WANDB_INIT_TIMEOUT, value: "120" }             # tolerate slow init under burst
            - { name: WANDB_HTTP_TIMEOUT, value: "60" }
            - { name: WANDB_X_STATS_SAMPLING_INTERVAL, value: "300" } # system stats every 5 min (was 2s default)
            # MiniWorld renders on the GPU via headless EGL (far more stable + faster
            # than software Xvfb/llvmpipe, which segfaults with many GL contexts). Read
            # ONLY by memrl/envs/miniworld_wrappers.py → inert for every non-MiniWorld
            # env. Runtime-only (the GPU-less Docker BUILD still uses the Xvfb default,
            # so the fatal build check passes). Set to "xvfb" to force software GL.
            - { name: MINIWORLD_RENDER, value: "egl" }
          # ── EDIT RESOURCES HERE (by hand) ─────────────────────────────────
          # Tip: keep NO cpu limit — a cpu limit (CFS quota) throttles every
          # thread at the cap, including wandb's heartbeat → the same starvation
          # that marked runs "crashed". Leave cpu as a request only. If you raise
          # PACK (runs/GPU), raise cpu + memory here to match.
          resources:
            limits:
              memory: 24Gi
              nvidia.com/gpu: 1            # PACK runs SHARE this one GPU
            requests:
              cpu: "6"
              memory: 20Gi
              nvidia.com/gpu: 1
