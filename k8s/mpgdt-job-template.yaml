# Per-script Job TEMPLATE for the B2 dense/sparse-toggle experiment.
# Substituted by k8s/launch-mpgdt-jobs.sh — one Job per (seed, cell, density)
# script, each running {none, e3b_idm} in parallel on one GPU.
# Only __JOBNAME__ and __SCRIPT__ are placeholders.
#
# Prereqs: image r0hanpat1l/memory:latest (rebuilt at the right GIT_REF),
# Secret `wandb` (key api-key). No PVC — wandb is the record (memrl-mpg-fallpenalty).
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  labels: { app: memrl-mpgdt }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: memrl-mpgdt, job: "__JOBNAME__" }
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: r0hanpat1l/memory:latest
          imagePullPolicy: Always
          command: ["bash", "__SCRIPT__"]
          env:
            - name: DEVICE
              value: "cuda"
            - name: RUNS_DIR
              value: "runs/mysterypath_densetoggle"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb
                  key: api-key
          # 2 runs (none + e3b_idm) train in parallel on the one GPU; sized accordingly.
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "6"
              memory: 32Gi
