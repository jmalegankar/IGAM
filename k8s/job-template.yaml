# Generic per-script Job TEMPLATE — one pod (one GPU) per training script.
#
# __JOBNAME__ and __SCRIPT__ are placeholders substituted by k8s/launch-jobs.sh,
# which fans this out into one Job per leaf script under
# experiments/s13_baseline/scripts/ (the 11 memory-baseline run_<cell>.sh + the
# 6 exploration explore_<cell>_<method>.sh), skipping the aggregators run_all.sh
# and run_exploration.sh.
#
# The scripts are baked into the image (the Dockerfile clones the repo to
# /workspace/IGAM, which is also WORKDIR), so __SCRIPT__ is a repo-relative path.
#
# Prereqs in the cluster (same as job.yaml):
#   * image r0hanpat1l/memory:latest reachable
#   * Secret `wandb` with key `api-key`  (see k8s/wandb-secret.example.yaml)
#   * ReadWriteMany PVC `memrl-runs`     (RWX so all per-job pods share it; if
#     your storage is RWO, give each job its own PVC or use a subPath)
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  labels: { app: memrl-s13 }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: memrl-s13, job: "__JOBNAME__" }
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: r0hanpat1l/memory:latest
          imagePullPolicy: Always
          # Run this script's seeds (parallel on the one GPU; PARALLEL=1).
          command: ["bash", "__SCRIPT__"]
          env:
            - name: DEVICE
              value: "cuda"
            - name: RUNS_DIR
              value: "runs/s13_baseline"
            - name: SEEDS
              value: "0 1 2"
            - name: PARALLEL
              value: "1"
            # ── Thread caps ─────────────────────────────────────────────────
            # Threads PER SEED. With PARALLEL=1 + SEEDS="0 1 2", 3 seed processes
            # run at once in this pod, so total threads = 4 × 3 = 12, which is
            # what the CPU request/limit below is sized to. MEMRL_TORCH_THREADS
            # caps torch; OMP/MKL/OPENBLAS cap NumPy/BLAS (env stepping + the
            # intrinsic nets) — without those, BLAS grabs all node cores and
            # blows past the CPU limit. Keep all four equal.
            - name: MEMRL_TORCH_THREADS
              value: "4"
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: OPENBLAS_NUM_THREADS
              value: "4"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb
                  key: api-key
          # CPU sized to (threads/seed × seeds) = 4 × 3 = 12; limit adds headroom
          # for the Python/CUDA driver overhead so the 12 worker threads aren't
          # CFS-throttled. If you change MEMRL_TORCH_THREADS or SEEDS, re-derive:
          #   cpu = MEMRL_TORCH_THREADS × (number of parallel seeds).
          resources:
            requests:
              cpu: "12"
              memory: 16Gi
            limits:
              cpu: "16"
              memory: 24Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: runs
              mountPath: /workspace/IGAM/runs
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: memrl-runs
