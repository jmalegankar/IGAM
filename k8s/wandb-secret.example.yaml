# Template for the wandb API-key Secret that the training Jobs read via
# secretKeyRef{name: wandb, key: api-key}. WITHOUT this secret applied, pods
# fail to start (missing secret) — so wandb never receives the runs.
#
# DO NOT put your real key in a committed file. Two safe ways to create it:
#
# (A) Imperative, from a local .secret file (already gitignored) — recommended:
#       echo -n "YOUR_WANDB_API_KEY" > .secret      # key from https://wandb.ai/authorize
#       kubectl create secret generic wandb --from-file=api-key=.secret
#     (rotate later:  kubectl create secret generic wandb \
#         --from-file=api-key=.secret --dry-run=client -o yaml | kubectl apply -f -)
#
# (B) Declarative: copy this file to k8s/wandb-secret.yaml (gitignored), fill in
#     the key, then `kubectl apply -f k8s/wandb-secret.yaml`.
#
# Verify it landed:  kubectl get secret wandb -o jsonpath='{.data.api-key}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: wandb
type: Opaque
stringData:                       # stringData = plaintext; k8s base64-encodes it
  api-key: "YOUR_WANDB_API_KEY"   # <-- replace; get from https://wandb.ai/authorize
