# Per-script Job TEMPLATE for the RedBlueDoors-8x8 study — one pod (one GPU) per
# training script. Dedicated (separate from k8s/job-template.yaml) so the S13 and
# RedBlueDoors sweeps never interfere. Substituted by k8s/launch-rbd-jobs.sh,
# which fans one Job per leaf script under experiments/redbluedoors_8x8/scripts/.
# Only __JOBNAME__ and __SCRIPT__ are placeholders.
#
# GPU (CNN image obs, 10M steps) — mirrors the S13 GPU template.
#
# Prereqs in the cluster:
#   * image r0hanpat1l/memory:latest reachable
#   * Secret `wandb` with key `api-key`  (see k8s/wandb-secret.example.yaml)
# (No PVC — wandb is the system of record: project memrl-redbluedoors-8x8.)
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  labels: { app: memrl-rbd }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: memrl-rbd, job: "__JOBNAME__" }
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: r0hanpat1l/memory:latest
          imagePullPolicy: Always
          # Run this script's seeds (parallel on the one GPU; PARALLEL=1).
          command: ["bash", "__SCRIPT__"]
          env:
            - name: DEVICE
              value: "cuda"
            - name: RUNS_DIR
              value: "runs/redbluedoors_8x8"
            - name: SEEDS
              value: "0 1 2"
            - name: PARALLEL
              value: "1"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb
                  key: api-key
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 16Gi
