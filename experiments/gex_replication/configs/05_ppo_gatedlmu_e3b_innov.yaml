# Exp 5b: GatedLMU + E3B with phi_source=innovation, no wrapper.
# The motivated run: gate produces innovation vector → used directly as E3B phi.
# IGAM exports innovation_vec as (B, encoder_dim) — the full pre-W_pre vector.
# GEX used r_intr (scalar norm) which made E3B degenerate. This is the fix.
env_name: MiniGrid-MemoryS11-v0
n_envs: 16
total_timesteps: 10_000_000
seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 160.0
    gate_type: softsign_sum
    residual_scale: 0.05

encoder_dim: 128
encoder_hidden: 256

lr: 3.0e-4
n_steps: 512
n_epochs: 4
gamma: 0.999
gae_lambda: 0.98
clip_range: 0.2
ent_coef: 0.008
vf_coef: 1.0
max_grad_norm: 0.5
target_kl: 0.05

chunk_len: 16
n_chunks_per_batch: 32

use_wrapper: false
beta_ep: 0.03
phi_source: innovation
lambda_reg: 1.0
