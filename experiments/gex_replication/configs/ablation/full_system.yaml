# Ablation baseline: full GatedLMU system. All architectural components ON.
# No-wrapper MemS13 + phiRand E3B (hardest condition).
# This is the reference every other ablation row is compared against.
env_name: MiniGrid-MemoryS13-v0
n_envs: 16
total_timesteps: 5_000_000
seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 200.0
    gate_type: softsign_sum       # gate ON
    residual_scale: 0.05          # anti-collapse residual ON
    multichannel: true            # C-dim innovation vector ON
    dynamic_readout: true         # W_query attention pointer ON
    orthogonal_W_pre: true        # exact isometry ON

encoder_dim: 128
encoder_hidden: 256

lr: 3.0e-4
n_steps: 512
n_epochs: 4
gamma: 0.999
gae_lambda: 0.98
clip_range: 0.2
ent_coef: 0.008
vf_coef: 1.0
max_grad_norm: 0.5
target_kl: 0.05

chunk_len: 16
n_chunks_per_batch: 32

use_wrapper: false
beta_ep: 0.1
phi_source: random_encoder
lambda_reg: 1.0
