# Exp 3b: GatedLMU write gate, scalar u (multichannel=False), with wrapper.
# Isolates the gate's contribution to stability vs exp 3 (plain LMU + wrapper).
# multichannel=False keeps scalar bandwidth matching canonical LMU — the only
# difference is the predictive-coding write gate + residual.
# Expected: stable learning, faster convergence than exp 3.
env_name: MiniGrid-MemoryS11-v0
n_envs: 16
total_timesteps: 10_000_000
seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 100.0
    gate_type: softsign_sum
    residual_scale: 0.05
    multichannel: false         # scalar u — same bandwidth as canonical LMU
    dynamic_readout: true
    orthogonal_W_pre: false

encoder_dim: 64
encoder_hidden: 128

lr: 3.0e-4
n_steps: 512
n_epochs: 4
gamma: 0.999
gae_lambda: 0.98
clip_range: 0.2
ent_coef: 0.008
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.05

chunk_len: 16
n_chunks_per_batch: 16

use_wrapper: true
beta_ep: 0.0
