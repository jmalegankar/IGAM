# Exp 5: PPO + GatedLMU + E3B (phi_rand), no wrapper. Full system.
# Expected: solves it — E3B drives exploration to the hint room;
# gate selectively retains the hint observation across the corridor.
# This is the headline result: no crutch, no wrapper, full solution.
env_name: MiniGrid-MemoryS11-v0
n_envs: 16
total_timesteps: 10_000_000
seed: 0

cell:
  name: GatedLMU
  kwargs:
    memory_size: 64
    theta: 100.0
    gate_type: softsign_sum
    residual_scale: 0.05

encoder_dim: 64
encoder_hidden: 128

lr: 3.0e-4
n_steps: 512
n_epochs: 4
gamma: 0.999
gae_lambda: 0.98
clip_range: 0.2
ent_coef: 0.008
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.05

chunk_len: 16
n_chunks_per_batch: 16

use_wrapper: false
beta_ep: 0.1
phi_source: random_encoder
lambda_reg: 1.0
