[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igam"
version = "0.1.0"
description = "Innovation-Gated Associative Memory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jai Malegaonkar" }]
dependencies = [
    "torch>=2.2",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
include = ["igam*"]

[tool.pytest.ini_options]
testpaths = ["igam"]
python_files = ["test_*.py"]
