[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igam"
version = "0.1.0"
description = "Innovation-Gated Associative Memory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jai Malegaonkar" }]
dependencies = [
    "torch>=2.2",
    "numpy",
    "stable-baselines3>=2.0",
    "gymnasium",
    "popgym",
    "tensorboard",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
include = ["igam*"]

[tool.pytest.ini_options]
testpaths = ["igam"]
python_files = ["test_*.py"]
markers = [
    "slow: full-training tests gated behind -m slow (deselected by default)",
]
addopts = "-m 'not slow'"
