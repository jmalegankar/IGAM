[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memrl"
version = "0.1.0"
description = "Recurrent / SSM memory cells and partially-observable RL environment wrappers under a common interface."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jai Malegaonkar" }]
dependencies = [
    "torch>=2.2",
    "numpy",
    "stable-baselines3>=2.0",
    "gymnasium",
    "popgym",
    "tensorboard",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]
memory-gym = [
    "memory-gym",
]
popgym-arcade = [
    "popgym-arcade",
    "jax",
]

[tool.setuptools.packages.find]
include = ["memrl*"]

[tool.pytest.ini_options]
testpaths = ["memrl"]
python_files = ["test_*.py"]
markers = [
    "slow: full-training tests gated behind -m slow (deselected by default)",
]
addopts = "-m 'not slow'"
